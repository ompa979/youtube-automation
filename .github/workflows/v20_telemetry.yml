name: V20 72h Telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "30 * * * *"

jobs:
  telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YT_CREDS_2: ${{ secrets.YT_CREDS_2 }}
    steps:
      - uses: actions/checkout@v4
      - name: Restore latest V20 telemetry state
        uses: actions/cache/restore@v4
        with:
          path: v20_telemetry.db
          key: v20-db-telemetry-${{ github.run_id }}
          restore-keys: |
            v20-db-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Evaluate closed 72h windows
        run: python scripts/v20_telemetry_runner.py
