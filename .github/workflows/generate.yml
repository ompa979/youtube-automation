name: ExamCracker YouTube Generator

on:
  workflow_dispatch:
    inputs:
      count:
        description: Number of Shorts to generate
        required: false
        default: "1"
      test_mode:
        description: Test mode (fast or full)
        required: false
        default: "fast"
        type: choice
        options:
          - fast
          - full
      dry_run:
        description: Dry run — render and thumbnail only, NEVER upload to YouTube
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/30 * * * *"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      YT_CREDS_1: ${{ secrets.YT_CREDS_1 }}
      YT_CREDS_2: ${{ secrets.YT_CREDS_2 }}
      YT_CREDS_3: ${{ secrets.YT_CREDS_3 }}
      YT_CREDS_4: ${{ secrets.YT_CREDS_4 }}
      YT_CREDS_5: ${{ secrets.YT_CREDS_5 }}
      YT_CREDS_6: ${{ secrets.YT_CREDS_6 }}
      YT_CREDS_7: ${{ secrets.YT_CREDS_7 }}
      YT_CREDS_8: ${{ secrets.YT_CREDS_8 }}
      YT_CREDS_9: ${{ secrets.YT_CREDS_9 }}
      YT_CREDS_10: ${{ secrets.YT_CREDS_10 }}
      YT_CREDS_11: ${{ secrets.YT_CREDS_11 }}
      YT_CREDS_12: ${{ secrets.YT_CREDS_12 }}
      YT_CREDS_13: ${{ secrets.YT_CREDS_13 }}
      YT_CREDS_14: ${{ secrets.YT_CREDS_14 }}
      YT_CREDS_15: ${{ secrets.YT_CREDS_15 }}
      YT_CREDS_16: ${{ secrets.YT_CREDS_16 }}
      YT_CREDS_17: ${{ secrets.YT_CREDS_17 }}
      YT_CREDS_18: ${{ secrets.YT_CREDS_18 }}
      YT_CREDS_19: ${{ secrets.YT_CREDS_19 }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_2: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_2 }}
      CLOUDFLARE_API_TOKEN_2: ${{ secrets.CLOUDFLARE_API_TOKEN_2 }}
      CLOUDFLARE_ACCOUNT_ID_3: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_3 }}
      CLOUDFLARE_API_TOKEN_3: ${{ secrets.CLOUDFLARE_API_TOKEN_3 }}
      CLOUDFLARE_ACCOUNT_ID_4: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_4 }}
      CLOUDFLARE_API_TOKEN_4: ${{ secrets.CLOUDFLARE_API_TOKEN_4 }}
      CLOUDFLARE_MAX_ACCOUNTS: "4"
      CLOUDFLARE_IMAGE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
      CLOUDFLARE_SCENE_MODEL: "@cf/black-forest-labs/flux-1-schnell"
      CLOUDFLARE_THUMBNAIL_MODEL: "@cf/black-forest-labs/flux-2-klein-4b"
      CLOUDFLARE_IMAGE_STEPS: "4"
      THUMBNAIL_VARIANTS: "5"
      EXAM_ONLY: "true"
      TOPIC_USE_TRENDS: "true"
      TOPIC_USE_AUTOCOMPLETE: "true"
      VOICE_LUFS: "-14"
      VOICE_TRUE_PEAK: "-1.5"
      TTS_PROVIDER: "edge"
      TTS_VOICE: "en-IN-PrabhatNeural"
      NICHES_ENABLED: "bank_it_officer,banking_awareness,bank_reasoning_quant,rbi_economy,ssc_general"
      COUNT: ${{ github.event.inputs.count || '1' }}
      TEST_MODE: ${{ github.event.inputs.test_mode || 'fast' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      UPLOAD_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '0' || '1' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Verify FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "[ffmpeg] not present on runner; installing from Ubuntu packages"
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          echo "[ffmpeg] $(command -v ffmpeg)"
          ffmpeg -hide_banner -version | head -n 3
          echo "[ffmpeg] filters:"
          ffmpeg -hide_banner -filters 2>/dev/null | grep -E '\b(drawtext|drawbox|ass)\b' || true

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install pytest==8.4.2

      - name: Fast thumbnail regression tests
        if: env.TEST_MODE != 'full'
        run: python -m pytest -q tests/test_fast_thumbnail_ci.py

      - name: Full regression tests
        if: env.TEST_MODE == 'full'
        run: python -m pytest -q

      - name: Verify YouTube credentials are wired
        if: env.DRY_RUN != 'true'
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for i in $(seq 1 19); do
            var="YT_CREDS_${i}"
            if [ -n "${!var:-}" ]; then
              echo "[youtube] ${var}=configured"
              found=$((found+1))
            else
              echo "[youtube] ${var}=not-configured"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "[youtube] ERROR: no YT_CREDS_N repository secrets are available to this workflow."
            echo "[youtube] Add YT_CREDS_1 (and optionally YT_CREDS_2..YT_CREDS_19) under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Generate
        shell: bash
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            echo "[workflow] DRY RUN enabled — uploads are disabled."
            python -m pipeline.generate --count "$COUNT" --dry-run
          else
            python -m pipeline.generate --count "$COUNT"
          fi

      - name: Upload dry-run artifacts
        if: always() && env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: examcracker-dry-run-${{ github.run_number }}
          path: |
            /tmp/out/*.mp4
            /tmp/out/*.jpg
            /tmp/out/*.json
            /tmp/out/thumbnail_variants/**
          if-no-files-found: warn
          retention-days: 7
