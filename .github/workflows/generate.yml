name: Generate YouTube Short

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (render but do not upload)?'
        type: boolean
        default: false

concurrency:
  group: youtube-shorts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system deps (ffmpeg + Inter font)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-inter espeak-ng

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Verify pipeline source
        run: |
          set -e

          echo "========================================"
          echo "=== COMMIT ==="
          echo "========================================"
          git rev-parse HEAD
          git log -1 --oneline

          echo ""
          echo "========================================"
          echo "=== TTS FILE ==="
          echo "========================================"
          test -f pipeline/tts.py
          ls -lh pipeline/tts.py

          echo ""
          echo "========================================"
          echo "=== SUBTITLE IMPLEMENTATION CHECK ==="
          echo "========================================"

          # Do not depend on an internal helper variable name.
          # Different valid TTS implementations may use safe_overlay,
          # safe_caption, or another local name.
          if grep -n "Dialogue:" pipeline/tts.py; then
            echo "PASS: ASS dialogue/subtitle event generation found"
          else
            echo "ERROR: No ASS Dialogue subtitle event found in pipeline/tts.py"
            exit 1
          fi

          if grep -n "Style: Cap" pipeline/tts.py; then
            echo "PASS: caption style found"
          else
            echo "ERROR: Caption style not found"
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "=== OLD BROKEN F-STRING CHECK ==="
          echo "========================================"
          if grep -n 'overlay_text.strip().replace' pipeline/tts.py; then
            echo "ERROR: OLD BROKEN TTS F-STRING IS STILL PRESENT"
            exit 1
          else
            echo "PASS: old broken overlay f-string is not present"
          fi

          echo ""
          echo "========================================"
          echo "=== PYTHON COMPILE ==="
          echo "========================================"
          python -m py_compile pipeline/tts.py
          python -m compileall -q pipeline
          python - <<'PY'
          import ast
          from pathlib import Path

          tts = Path("pipeline/tts.py").read_text(encoding="utf-8")
          gen = Path("pipeline/generate.py").read_text(encoding="utf-8")
          script = Path("pipeline/script_gen.py").read_text(encoding="utf-8")

          assert "def _safe_text(" in tts
          assert "def _gtts_synth(" in tts
          assert "def _espeak_synth(" in tts
          assert 'base = ["gtts", "edge", "espeak"]' in tts
          assert "subtitle_text:" in tts and "tts_text:" in tts
          assert "audio_path=audio_path" in gen
          assert "ass_path=ass_path" in gen
          assert "subtitle_text=narration" in gen
          assert "tts_text=tts_text" in gen
          assert "def _first_text(" in script
          assert "Generated scene" in script

          for name, source in [("tts.py", tts), ("generate.py", gen), ("script_gen.py", script)]:
              ast.parse(source, filename=name)

          print("PASS: TTS provider chain verified")
          print("PASS: scene text normalization verified")
          print("PASS: generate.py -> tts.py API verified")
          print("PASS: centered subtitle pipeline verified")
          PY

          echo ""
          echo "========================================"
          echo "=== SOURCE VERIFICATION PASSED ==="
          echo "========================================"

      - name: Generate & upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TTS_PROVIDER: gtts
          TTS_LANGUAGE: hi-IN
          TTS_VOICE: hi-IN-MadhurNeural,hi-IN-SwaraNeural
          TTS_NO_FALLBACK: false
          YT_CREDS_1: ${{ secrets.YT_CREDS_1 }}
          YT_CREDS_2: ${{ secrets.YT_CREDS_2 }}
          YT_CREDS_3: ${{ secrets.YT_CREDS_3 }}
          YT_CREDS_4: ${{ secrets.YT_CREDS_4 }}
          NICHES_ENABLED: 'exam_concepts,science_explainers'
          LANGUAGES_ENABLED: 'hinglish'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "[i] Dry run — skipping upload."
            python -m pipeline.generate --dry-run
          else
            python -m pipeline.generate
          fi

      - name: Collect rendered video
        if: always()
        run: |
          mkdir -p out
          if compgen -G "/tmp/out/*.mp4" > /dev/null; then
            cp -v /tmp/out/*.mp4 out/
          fi
          if [ -f /tmp/out/script.json ]; then
            cp -v /tmp/out/script.json out/
          fi
          if ! compgen -G "out/*.mp4" > /dev/null; then
            echo "[i] No rendered MP4 found in /tmp/out"
          fi
          ls -lah out || true

      - name: Upload rendered video as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: warn

      - name: Commit state back
        if: always()
        run: |
          git config user.name "bds-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content_plan.json .quota_state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "[i] Nothing to commit."
            exit 0
          fi
          git commit -m "chore: update rotation & quota [skip ci]"
          git push
