name: Generate YouTube Short

on:
  schedule:
    # 7:00 PM IST = 13:30 UTC — peak Indian audience time
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (render but do not upload)?
        type: boolean
        default: true

concurrency:
  group: youtube-shorts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore quota state
        uses: actions/cache@v4
        with:
          path: .quota_state.json
          # Exact key is unique per run so the post-job save always creates a
          # fresh cache entry (cache entries are immutable once written).
          # restore-keys falls back to the most recent previous entry, so
          # this one step both restores AND persists quota state across
          # runs — with no git commit/push, so it can never conflict with
          # your own pushes to main the way the old approach did.
          key: quota-state-${{ github.run_id }}
          restore-keys: |
            quota-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng fonts-inter

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Verify source before generation
        run: |
          python -m py_compile pipeline/generate.py pipeline/script_gen.py \
            pipeline/tts.py pipeline/visuals.py pipeline/render.py \
            pipeline/trending.py pipeline/upload.py
          python - <<'PY'
          import json
          d=json.load(open('content_plan.json',encoding='utf-8'))
          assert all(v.get('visual_style') == 'educational_ai' for v in d['niches'].values())
          print('PASS: educational_ai visual style configured')
          PY

      - name: Generate
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_TTS_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_CREDS_1: ${{ secrets.YT_CREDS_1 }}
          UPLOAD_ENABLED: 'false'
          NICHES_ENABLED: 'exam_concepts,science_explainers'
          LANGUAGES_ENABLED: 'en'
          TTS_PROVIDER: edge
          TTS_LANGUAGE: en-IN
          TTS_VOICE: en-IN-NeerjaNeural
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m pipeline.generate --dry-run
          else
            python -m pipeline.generate
          fi

      - name: Collect artifact
        if: always()
        run: |
          mkdir -p out
          cp -v /tmp/out/*.mp4 out/ 2>/dev/null || true
          cp -v /tmp/out/thumbnail.jpg out/ 2>/dev/null || true
          cp -v /tmp/out/script.json out/ 2>/dev/null || true
          ls -lah out || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_number }}
          path: out/
          retention-days: 7
          if-no-files-found: warn
