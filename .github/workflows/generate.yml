name: Generate YouTube Shorts

# ─────────────────────────────────────────────────────────────────────────────
# One workflow run per day at 07:00 IST (01:30 UTC).
# The pipeline itself loops internally: 3 videos × 45-min gap = ~2.5 h total.
# The next day's cron at 07:00 IST naturally restarts the cycle.
# workflow_dispatch lets you kick off a run manually at any time.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (render but do not upload)?'
        type: boolean
        default: false
      count:
        description: 'Number of videos to produce (default: 3)'
        type: number
        default: 3

# Never cancel an in-flight run — it may be mid-upload.
concurrency:
  group: youtube-shorts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 3 videos × 45 min gap + render buffer = ~240 min max
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore quota state
        uses: actions/cache@v4
        with:
          path: .quota_state.json
          key: quota-state-${{ github.run_id }}
          restore-keys: |
            quota-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng fonts-inter

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install faster-whisper (Edge TTS word-timing alignment)
        run: pip install faster-whisper

      - name: Verify source before generation
        run: |
          python -m py_compile pipeline/generate.py pipeline/script_gen.py \
            pipeline/tts.py pipeline/visuals.py pipeline/render.py \
            pipeline/trending.py pipeline/upload.py pipeline/engagement_v2.py \
            pipeline/thumbnail_ai.py
          python - <<'PY'
          import json
          d = json.load(open('content_plan.json', encoding='utf-8'))
          niches = d['niches']
          assert all(v.get('visual_style') in ('cinematic_hud', 'educational_ai', 'text_card') for v in niches.values()), "niche visual_style must be cinematic_hud, educational_ai, or text_card"
          total_topics = sum(len(v.get('topics', [])) for v in niches.values())
          print(f'PASS: {len(niches)} niches, {total_topics} topics, visual styles valid')
          PY

      - name: Run 100 thumbnail sanity tests
        run: python -m unittest tests.test_thumbnail_engine_100 -v

      - name: Run Cloudflare scene-image provider tests
        run: python -m unittest tests.test_cloudflare_scene_provider -v

      - name: Generate & Upload (3 videos × 45 min)
        env:
          # Gemini remains enabled for text/script generation only.
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
          # Cloudflare Workers AI + FLUX.1 Schnell is the active AI image generator
          CLOUDFLARE_ACCOUNT_ID:   ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN:    ${{ secrets.CLOUDFLARE_API_TOKEN }}
          IMAGE_PROVIDER:          'cloudflare'
          CLOUDFLARE_SCENE_IMAGES_ENABLED: 'true'
          CLOUDFLARE_SCENE_WIDTH:    '768'
          CLOUDFLARE_SCENE_HEIGHT:   '1365'
          CLOUDFLARE_IMAGE_MODEL:  '@cf/black-forest-labs/flux-1-schnell'
          CLOUDFLARE_IMAGE_STEPS:  '4'
          THUMBNAIL_VARIANTS:      '3'
          YT_CREDS_1:             ${{ secrets.YT_CREDS_1 }}
          UPLOAD_ENABLED:         'true'
          UPLOAD_COUNT:           ${{ inputs.count || '3' }}
          NICHES_ENABLED:         'ai_tech_hacks,science_curiosity,money_wealth_hacks,everyday_life_hacks,banking_awareness,bank_it_officer,bank_reasoning_quant,rbi_economy,bank_english'
          LANGUAGES_ENABLED:      'en'
          TTS_PROVIDER:           edge
          TTS_LANGUAGE:           en-IN
          TTS_VOICE:              en-IN-PrabhatNeural
          TTS_RATE:               '+0%'
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m pipeline.generate --dry-run --count ${{ inputs.count || 3 }}
          else
            python -m pipeline.generate --count ${{ inputs.count || 3 }}
          fi

      - name: Collect last artifact
        if: always()
        run: |
          mkdir -p out
          cp -v /tmp/out/*.mp4 out/ 2>/dev/null || true
          cp -v /tmp/out/thumbnail.jpg out/ 2>/dev/null || true
          cp -rv /tmp/out/thumbnail_variants out/ 2>/dev/null || true
          cp -v /tmp/out/script.json out/ 2>/dev/null || true
          ls -lah out || true

      # Keep only the final artifact from each day's run.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_number }}
          path: out/
          retention-days: 1
          if-no-files-found: warn
