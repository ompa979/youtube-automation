name: Generate YouTube Shorts

# ─────────────────────────────────────────────────────────────────────────────
# One workflow run per day at 07:00 IST (01:30 UTC).
# The pipeline itself loops internally: 15 videos × 45-min gap = ~11.5 h total.
# The next day's cron at 07:00 IST naturally restarts the cycle.
# workflow_dispatch lets you kick off a run manually at any time.
# ─────────────────────────────────────────────────────────────────────────────
on:
  schedule:
    - cron: '30 1 * * *'   # 07:00 IST daily
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (render but do not upload)?'
        type: boolean
        default: false
      count:
        description: 'Number of videos to produce (default: 15)'
        type: number
        default: 15

# Never cancel an in-flight run — it may be mid-upload.
concurrency:
  group: youtube-shorts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 15 videos × 45 min gap + 20 min final render buffer = 695 min max (~11.6 h)
    timeout-minutes: 695
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore quota state
        uses: actions/cache@v4
        with:
          path: .quota_state.json
          key: quota-state-${{ github.run_id }}
          restore-keys: |
            quota-state-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng fonts-inter

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Verify source before generation
        run: |
          python -m py_compile pipeline/generate.py pipeline/script_gen.py \
            pipeline/tts.py pipeline/visuals.py pipeline/render.py \
            pipeline/trending.py pipeline/upload.py
          python - <<'PY'
          import json
          d = json.load(open('content_plan.json', encoding='utf-8'))
          assert all(v.get('visual_style') == 'educational_ai' for v in d['niches'].values())
          print('PASS: educational_ai visual style configured')
          PY

      - name: Generate & Upload (15 videos × 45 min)
        env:
          GEMINI_API_KEY:         ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_TTS_KEY:   ${{ secrets.GOOGLE_CLOUD_TTS_KEY }}
          PEXELS_API_KEY:         ${{ secrets.PEXELS_API_KEY }}
          YT_CREDS_1:             ${{ secrets.YT_CREDS_1 }}
          UPLOAD_ENABLED:         'true'
          UPLOAD_COUNT:           ${{ inputs.count || '15' }}
          NICHES_ENABLED:         'exam_concepts,science_explainers'
          LANGUAGES_ENABLED:      'en'
          TTS_PROVIDER:           edge
          TTS_LANGUAGE:           en-IN
          TTS_VOICE:              en-IN-NeerjaNeural
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m pipeline.generate --dry-run --count ${{ inputs.count || 15 }}
          else
            python -m pipeline.generate --count ${{ inputs.count || 15 }}
          fi

      - name: Collect last artifact
        if: always()
        run: |
          mkdir -p out
          cp -v /tmp/out/*.mp4 out/ 2>/dev/null || true
          cp -v /tmp/out/thumbnail.jpg out/ 2>/dev/null || true
          cp -v /tmp/out/script.json out/ 2>/dev/null || true
          ls -lah out || true

      # Keep only the final artifact from each day's run.
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-short-${{ github.run_number }}
          path: out/
          retention-days: 1
          if-no-files-found: warn
